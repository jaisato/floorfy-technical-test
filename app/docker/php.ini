; Production settings shared by php-fpm (API) and the CLI worker.
; Loaded after php.ini-production from $PHP_INI_DIR/conf.d/zz-app.ini.

expose_php = Off
date.timezone = UTC

; Higher than the worker's --memory-limit=256M so Messenger can stop the worker
; gracefully before PHP kills the process.
memory_limit = 512M

display_errors = Off
display_startup_errors = Off
log_errors = On
; Container stderr, so `docker compose logs` shows PHP errors.
error_log = /proc/self/fd/2

; The API only accepts small JSON bodies; videos are never uploaded.
post_max_size = 2M
upload_max_filesize = 2M
file_uploads = Off
max_execution_time = 60

realpath_cache_size = 4096K
realpath_cache_ttl = 600

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The image is immutable (the code is copied in at build time), so there is no
; point in stat()-ing every file on every request.
opcache.validate_timestamps = 0
