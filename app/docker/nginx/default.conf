server {
  listen 80;
  server_name _;

  # Do not advertise the version in responses or error pages.
  server_tokens off;

  root /var/www/html/public;

  # The API only accepts small JSON bodies; videos are produced here, never
  # uploaded. Anything larger is refused before it reaches PHP.
  client_max_body_size 64k;

  # Dotfiles, which includes the .staging directory videos are written into
  # before being moved into place. A half-written file is never reachable.
  location ~ /\.(?!well-known) {
    deny all;
  }

  # Generated videos. They are immutable - the name carries the task or part id -
  # so they can be cached hard, and served without touching PHP.
  location /videos/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.php$is_args$args;
  }

  location ~ ^/index\.php(/|$) {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $document_root;

    # The request only enqueues work; the video itself is made by the worker.
    fastcgi_read_timeout 30s;

    fastcgi_pass php:9000;

    # Reachable only through the try_files above, never as a URL of its own, so
    # no PHP file can be selected by the client.
    internal;
  }

  # Everything else that ends in .php: there is one front controller and this is
  # not it.
  location ~ \.php$ {
    return 404;
  }
}
