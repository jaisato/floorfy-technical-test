server {
  listen 80;
  server_name _;

  # Do not advertise the version in responses or error pages.
  server_tokens off;

  root /var/www/html/public;

  # The API only accepts small JSON bodies; videos are produced here, never
  # uploaded. Anything larger is refused before it reaches PHP.
  client_max_body_size 64k;

  # Dotfiles, which includes the .staging directory videos are written into
  # before being moved into place. A half-written file is never reachable.
  location ~ /\.(?!well-known) {
    deny all;
  }

  # Generated videos. The request goes to the application, which checks the
  # signature the URL carries, and answers with X-Accel-Redirect; the bytes are
  # then sent by nginx from the internal location below, so no PHP process is
  # held for the length of a download. Serving $uri here directly would hand
  # the file over before anything had been checked.
  location /videos/ {
    rewrite ^ /index.php last;
  }

  # Where those videos actually live. "internal" means nginx will only serve
  # this after the application has redirected to it - a client asking for the
  # path itself gets a 404.
  location /protected-videos/ {
    internal;
    alias /var/www/html/public/videos/;
    access_log off;
  }

  # Liveness and readiness. Handled by PHP like any other route - a probe that
  # nginx answers by itself says nothing about the application behind it - but
  # kept out of the access log, since a prober asks every few seconds.
  location ~ ^/health(/|$) {
    access_log off;
    try_files $uri /index.php$is_args$args;
  }

  location / {
    try_files $uri /index.php$is_args$args;
  }

  location ~ ^/index\.php(/|$) {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $document_root;

    # The request only enqueues work; the video itself is made by the worker.
    fastcgi_read_timeout 30s;

    fastcgi_pass php:9000;

    # Reachable only through the try_files above, never as a URL of its own, so
    # no PHP file can be selected by the client.
    internal;
  }

  # Everything else that ends in .php: there is one front controller and this is
  # not it.
  location ~ \.php$ {
    return 404;
  }
}
