services:
    # The idempotency identifiers are declared utf8mb4_bin so they compare byte
    # for byte; SQLite, which the test profile uses, has that behaviour but not
    # that name and would refuse the CREATE TABLE. Every other driver passes
    # through it untouched.
    App\Shared\Infrastructure\Persistence\Doctrine\Middleware\SqliteBinaryCollationMiddleware:
        tags: ['doctrine.middleware']

doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

    orm:
        default_entity_manager: default

        entity_managers:
            default:
                naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
                auto_mapping: false

                mappings:
                    Task:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/src/Task/Infrastructure/Persistence/Doctrine/Entity'
                        prefix: 'App\Task\Infrastructure\Persistence\Doctrine\Entity'
                        alias: Task
                    Shared:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/src/Shared/Infrastructure/Persistence/Doctrine/Entity'
                        prefix: 'App\Shared\Infrastructure\Persistence\Doctrine\Entity'
                        alias: Shared
