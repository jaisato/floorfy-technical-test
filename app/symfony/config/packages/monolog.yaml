monolog:
    channels:
        # "deprecation" is where Symfony sends its own notices; "task" is the
        # video pipeline's channel, and has to exist in every environment
        # because the worker asks the container for monolog.logger.task.
        - deprecation
        - task

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "php://stderr"
                level: info

            task:
                type: stream
                path: "php://stderr"
                level: debug
                channels: [ "task" ]

            task_file:
                type: stream
                path: "%kernel.logs_dir%/task.log"
                level: debug
                channels: [ "task" ]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
