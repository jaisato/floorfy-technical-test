framework:
    messenger:
        default_bus: messenger.bus.command

        buses:
            messenger.bus.command:
                default_middleware: true
            messenger.bus.query:
                default_middleware: true

        # Where a message goes once its retries are exhausted. Without this the
        # message is discarded, and a task nobody can explain is left behind.
        # Inspect with `messenger:failed:show`, requeue with
        # `messenger:failed:retry`.
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    # Video work fails for reasons that pass: an image host that
                    # is briefly down, a worker that ran out of memory. Backing
                    # off from 10s to a 10-minute ceiling spreads twenty attempts
                    # over roughly three hours.
                    max_retries: 20
                    delay: 10000
                    multiplier: 2
                    max_delay: 600000

            callbacks:
                dsn: '%env(MESSENGER_CALLBACKS_TRANSPORT_DSN)%'
                retry_strategy:
                    # A webhook endpoint that is down comes back in minutes,
                    # not hours: six attempts from 30s to a 10-minute ceiling,
                    # then the failed queue. Its own transport so that a broken
                    # endpoint never queues behind video work, or vice versa.
                    max_retries: 5
                    delay: 30000
                    multiplier: 2
                    max_delay: 600000

            failed:
                dsn: '%env(MESSENGER_FAILURE_TRANSPORT_DSN)%'
                retry_strategy:
                    # A dead-letter queue is a place to look, not to retry from.
                    max_retries: 0

        routing:
            App\Task\Application\Command\ProcessVideoTaskCommand: async
            App\Task\Application\Callback\NotifyTaskCallback: callbacks
