# Local stack. Every variable has a development default, so `docker compose up`
# works without a root .env file; copy .env.example to .env to override them.
#
# The php, worker and migrate services share one image built from ./app, which
# contains the application code and its production dependencies. Rebuild after
# changing code: `docker compose up -d --build` (or `make build`).

x-app-environment: &app-environment
  APP_ENV: prod
  APP_DEBUG: "0"
  APP_SECRET: ${APP_SECRET:-dev-only-secret-not-for-production}
  DATABASE_URL: "mysql://${DB_USER:-app}:${DB_PASSWORD:-app_dev_password}@mysql:3306/${DB_NAME:-app}?serverVersion=8.0&charset=utf8mb4"
  MESSENGER_TRANSPORT_DSN: "amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app_dev_password}@rabbitmq:5672/%2f/messages"
  MESSENGER_FAILURE_TRANSPORT_DSN: "amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app_dev_password}@rabbitmq:5672/%2f/failed"
  MESSENGER_CALLBACKS_TRANSPORT_DSN: "amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app_dev_password}@rabbitmq:5672/%2f/callbacks"
  # Signs the webhook notifications (X-Task-Signature). Replace per deployment.
  CALLBACK_SIGNING_SECRET: ${CALLBACK_SIGNING_SECRET:-dev-only-callback-signing-secret-replace-me}
  # Public base URL clients use to reach nginx; the video URLs the API returns
  # are built from it. One variable, not two: the worker used to build URLs from
  # whichever of APP_URL and BASE_PUBLIC_URL happened to be set.
  APP_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  DEFAULT_URI: ${PUBLIC_BASE_URL:-http://localhost:8080}
  # How long a claimed task may stay "processing" before another worker may take
  # it over. Only reached when a worker is killed mid-task.
  TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-3600}
  # How long an Idempotency-Key sent with POST /api/tasks is remembered.
  IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-86400}
  # API keys, "name:secret" pairs separated by commas. Empty leaves the API
  # open, which is the default.
  API_TOKENS: ${API_TOKENS:-}
  # HMAC key for the signed video URLs, and how long one stays valid. Empty
  # serves the videos unsigned; set it whenever API_TOKENS is set, or the
  # videos of an authenticated API stay readable by anyone with the link.
  VIDEO_URL_SECRET: ${VIDEO_URL_SECRET:-}
  VIDEO_URL_TTL_SECONDS: ${VIDEO_URL_TTL_SECONDS:-3600}
  # nginx serves the video files from this internal location once the
  # application has checked the signature, so PHP never carries the bytes.
  VIDEOS_X_ACCEL_PREFIX: /protected-videos
  # Tasks one caller may create per minute; 0 turns the limit off.
  RATE_LIMIT_TASK_CREATION: ${RATE_LIMIT_TASK_CREATION:-0}
  # The reverse proxies whose X-Forwarded-* headers are believed, when this
  # stack sits behind one (a TLS-terminating load balancer in front of nginx).
  # Empty ignores the headers; nginx itself needs no entry, it speaks FastCGI.
  SYMFONY_TRUSTED_PROXIES: ${SYMFONY_TRUSTED_PROXIES:-}
  # Render defaults for a task that does not choose its own.
  RENDER_DEFAULT_DURATION: ${RENDER_DEFAULT_DURATION:-3}
  RENDER_DEFAULT_FPS: ${RENDER_DEFAULT_FPS:-30}
  RENDER_DEFAULT_RESOLUTION: ${RENDER_DEFAULT_RESOLUTION:-1280x720}
  RENDER_DEFAULT_CROSSFADE: ${RENDER_DEFAULT_CROSSFADE:-0}
  # How long each ffmpeg call may run, and how many threads it may use (0 lets
  # ffmpeg decide). They belong here and not only in app/symfony/.env: that file
  # is the image's default, so setting these in the shell or the root .env did
  # nothing at all - and the lease is derived from the two timeouts, so raising
  # a timeout without raising it here also left the lease where it was.
  FFMPEG_ANIMATE_TIMEOUT: ${FFMPEG_ANIMATE_TIMEOUT:-600}
  FFMPEG_COMPOSE_TIMEOUT: ${FFMPEG_COMPOSE_TIMEOUT:-3600}
  FFMPEG_THREADS: ${FFMPEG_THREADS:-0}

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./app/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Only the public directory is exposed to the web server; the same path
      # exists in the php image, so SCRIPT_FILENAME resolves on both sides.
      - ./app/symfony/public:/var/www/html/public:ro
      - videos_data:/var/www/html/public/videos:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      # Through the whole chain - nginx, fastcgi, PHP - rather than asking
      # nginx whether nginx is up.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  php:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - videos_data:/var/www/html/public/videos
      - work_data:/var/www/html/var/work
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # The same checks GET /health/ready runs: database, queue, ffmpeg and the
      # two volumes. php-fpm speaks FastCGI, not HTTP, so it is asked from the
      # shell instead of over the network.
      test: ["CMD", "php", "bin/console", "app:health:ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Renders videos. One message at a time, and a render is minutes, which is
  # why the webhooks have a worker of their own below: given both queues, this
  # process could not deliver a callback until the video in front of it was
  # finished, and the separate transport bought nothing.
  worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["entrypoint-worker.sh"]
    command: ["async"]
    environment:
      <<: *app-environment
      # The worker exits after either limit and is restarted by the policy above.
      WORKER_TIME_LIMIT: "3600"
      WORKER_MEMORY_LIMIT: "256M"
    volumes:
      - videos_data:/var/www/html/public/videos
      - work_data:/var/www/html/var/work
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # The worker serves nothing, so this is the only way to see that the
      # process still has everything it needs to render a video.
      test: ["CMD", "php", "bin/console", "app:health:ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Delivers the webhooks. Its own process, so a notification goes out while a
  # video is being rendered rather than after it; it writes no files, so it
  # mounts no volumes.
  callback-worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["entrypoint-worker.sh"]
    command: ["callbacks"]
    environment:
      <<: *app-environment
      WORKER_TIME_LIMIT: "3600"
      WORKER_MEMORY_LIMIT: "128M"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "bin/console", "app:health:ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # One-shot: applies pending Doctrine migrations once MySQL accepts connections,
  # then exits. php and worker wait for it, so the schema always exists before
  # the first request or message is handled.
  migrate:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: "no"
    entrypoint: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction", "--allow-no-migration"]
    environment: *app-environment
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-app}
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_dev_password}
      # The application never connects as root; the root password is generated
      # at first start and only printed in the MySQL container log.
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      # Host access for inspection only (e.g. `mysql -h 127.0.0.1 -P 3307 -u app -p`).
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # mysqladmin ping exits 0 as soon as the server answers on TCP, which is
      # only after the init scripts (database + user creation) have finished.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app_dev_password}
    ports:
      # Management UI only; AMQP stays on the compose network.
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  mysql_data:
  rabbitmq_data:
  videos_data:
  work_data:
